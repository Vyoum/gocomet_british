<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#334155"/></marker></defs>
<rect width="1100" height="560" fill="#ffffff"/>
<text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">RFQ British Auction — Architecture</text>
<rect x="30" y="80" width="250" height="200" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="155" y="110" text-anchor="middle" font-size="16" font-weight="bold">React SPA (Vite + Tailwind)</text>
<text x="155" y="132" text-anchor="middle" font-size="13" fill="#475569">Hosted on Vercel</text>
<text x="50" y="165" font-size="13">• List / Create / Details pages</text>
<text x="50" y="187" font-size="13">• Demo role switcher</text>
<text x="62" y="205" font-size="12" fill="#475569">(X-Role / X-Supplier headers)</text>
<text x="50" y="227" font-size="13">• Live countdowns (serverTime)</text>
<text x="50" y="249" font-size="13">• EventSource + 5 s poll fallback</text>
<rect x="400" y="70" width="320" height="250" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="560" y="100" text-anchor="middle" font-size="16" font-weight="bold">FastAPI (Python 3.12, uvicorn)</text>
<text x="560" y="121" text-anchor="middle" font-size="13" fill="#475569">Hosted on Render</text>
<text x="420" y="152" font-size="12">• Routes + Pydantic v2 (main.py, schemas.py)</text>
<text x="420" y="174" font-size="12">• Service: create_rfq / place_bid (service.py)</text>
<text x="432" y="192" font-size="12" fill="#475569">one txn · SELECT … FOR UPDATE · Idempotency</text>
<text x="420" y="214" font-size="13">• Pure engine: rank / extend / status</text>
<text x="432" y="232" font-size="12" fill="#475569">(auction.py, no I/O)</text>
<text x="420" y="254" font-size="13">• In-process SSE bus (events.py)</text>
<text x="420" y="276" font-size="13">• Redis relay (only if REDIS_URL set)</text>
<rect x="830" y="110" width="250" height="170" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="955" y="142" text-anchor="middle" font-size="16" font-weight="bold">PostgreSQL 16</text>
<text x="955" y="163" text-anchor="middle" font-size="13" fill="#475569">Render Postgres</text>
<text x="845" y="194" font-size="12">Supplier · Rfq · Bid · ActivityLog</text>
<text x="845" y="216" font-size="12">SQLAlchemy 2.0 async + psycopg 3</text>
<text x="845" y="238" font-size="12">Alembic migrations</text>
<text x="845" y="260" font-size="12">CHECK constraints backstop</text>
<line x1="280" y1="150" x2="398" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="339" y="140" text-anchor="middle" font-size="12">REST JSON /api/*</text>
<line x1="398" y1="230" x2="282" y2="230" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="339" y="220" text-anchor="middle" font-size="12">SSE /api/events</text>
<text x="339" y="250" text-anchor="middle" font-size="11" fill="#475569">data: {rfqId}</text>
<line x1="720" y1="195" x2="838" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="779" y="185" text-anchor="middle" font-size="12">SQL (txn)</text>
<rect x="300" y="370" width="770" height="170" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="8 5"/>
<text x="320" y="396" font-size="14" font-weight="bold" fill="#9a3412">Optional — only when REDIS_URL / CELERY_BROKER_URL is set (not on the free Render deploy)</text>
<rect x="330" y="420" width="190" height="90" rx="10" fill="#ffedd5" stroke="#ea580c"/>
<text x="425" y="452" text-anchor="middle" font-size="14" font-weight="bold">Celery beat</text>
<text x="425" y="474" text-anchor="middle" font-size="11">every CLOSE_SWEEP_SECONDS</text>
<text x="425" y="492" text-anchor="middle" font-size="12">(app/worker.py)</text>
<rect x="580" y="420" width="170" height="90" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="665" y="452" text-anchor="middle" font-size="14" font-weight="bold">Redis</text>
<text x="665" y="474" text-anchor="middle" font-size="12">broker + pub/sub</text>
<text x="665" y="492" text-anchor="middle" font-size="12">channel rfq:events</text>
<rect x="810" y="420" width="230" height="90" rx="10" fill="#ffedd5" stroke="#ea580c"/>
<text x="925" y="447" text-anchor="middle" font-size="14" font-weight="bold">Celery worker</text>
<text x="925" y="468" text-anchor="middle" font-size="11">close_due_auctions (app/closer.py)</text>
<text x="925" y="486" text-anchor="middle" font-size="12">FOR UPDATE SKIP LOCKED</text>
<text x="925" y="503" text-anchor="middle" font-size="11">AUCTION_CLOSED / FORCE_CLOSED</text>
<line x1="520" y1="465" x2="578" y2="465" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="750" y1="465" x2="808" y2="465" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="955" y1="420" x2="955" y2="282" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="962" y="350" font-size="12">closedStatus + log</text>
<line x1="665" y1="420" x2="665" y2="322" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="672" y="350" font-size="12">PUBLISH → relay → SSE bus</text>
</svg>
