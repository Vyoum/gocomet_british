services:
  - type: web
    name: gocomet-british-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start # prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gocomet-british-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # set to your Vercel URL after deploying the frontend
      - key: NODE_VERSION
        value: "20"

databases:
  - name: gocomet-british-db
    databaseName: rfq
    plan: free
