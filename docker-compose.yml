services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rfq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rfq"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rfq
      PORT: "4000"
      CORS_ORIGIN: ""
      SEED_DEMO: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
