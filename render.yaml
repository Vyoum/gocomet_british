services:
  - type: web
    name: gocomet-british-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh # alembic upgrade head -> seed demo if SEED_DEMO=true and DB empty -> uvicorn
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gocomet-british-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # set to your Vercel URL after deploying the frontend
      - key: SEED_DEMO
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.8"

# Celery + Redis auto-close (backend/app/worker.py) is OPTIONAL and intentionally not provisioned here:
# the free deployment has no Redis and the API works without it (status is computed on read).
# To enable it, add a Key Value (Redis) instance + a worker running
# `celery -A app.worker worker -B --loglevel=info` and set REDIS_URL on the API and worker (paid services).

databases:
  - name: gocomet-british-db
    databaseName: rfq
    plan: free
