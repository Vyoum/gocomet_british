services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rfq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rfq"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rfq
      REDIS_URL: redis://redis:6379/0
      CLOSE_SWEEP_SECONDS: "15"
      PORT: "4000"
      CORS_ORIGIN: ""
      SEED_DEMO: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  # Optional auto-close job: remove these two services (and REDIS_URL) to run without Redis.
  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_started # backend runs the migrations
      redis:
        condition: service_healthy
  beat:
    build: ./backend
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
volumes:
  pgdata:
